<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Калькулятор среднего балла</title>
    <!-- PWA метатеги -->
    <meta name="theme-color" content="#1f3e4c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Средний балл">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%231f3e4c'/%3E%3Ctext x='256' y='380' font-size='320' text-anchor='middle' fill='white' font-weight='bold'%3E📊%3C/text%3E%3C/svg%3E">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #eef2f7 0%, #d4dee9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 16px;
        }

        .app-container {
            max-width: 700px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .main-column {
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(2px);
            border-radius: 56px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            padding: 20px 22px 32px;
        }

        .right-column {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .marks-list-section {
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(2px);
            border-radius: 56px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            padding: 20px 22px 32px;
        }

        .floating-message-area {
            margin: 4px 0 18px 0;
            min-height: 68px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .action-feedback {
            background: #1f3e4c;
            color: white;
            padding: 12px 24px;
            border-radius: 80px;
            font-size: 1.2rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 14px;
            backdrop-filter: blur(12px);
            background: rgba(31, 62, 76, 0.92);
            box-shadow: 0 12px 20px rgba(0,0,0,0.2);
            transition: opacity 0.2s ease, transform 0.2s ease;
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
        }

        .action-feedback.show {
            opacity: 1;
            transform: translateY(0);
        }

        .action-feedback span:first-child {
            font-size: 1.6rem;
        }

        .stats-panel {
            background: white;
            border-radius: 48px;
            padding: 20px 16px;
            margin-bottom: 26px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }

        .stat-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 20px;
        }

        .stat-item {
            flex: 1;
            background: #f6f9fe;
            border-radius: 32px;
            padding: 14px 8px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
            color: #3a6685;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 2.4rem;
            font-weight: 800;
            color: #0a2a3b;
            line-height: 1.2;
        }

        .final-grade {
            background: linear-gradient(125deg, #fae8c0, #f5b642);
            border-radius: 48px;
            padding: 14px 18px;
            text-align: center;
            margin-top: 12px;
        }

        .final-grade .stat-label {
            color: #523400;
            font-size: 0.9rem;
            font-weight: 800;
        }

        .final-grade .stat-value {
            font-size: 3.5rem;
            color: #1e2a00;
            font-weight: 800;
        }

        .grades-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            margin: 16px 0 24px;
        }

        .grade-btn {
            border: none;
            font-size: 2rem;
            font-weight: 800;
            padding: 18px 0;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.08s linear;
            font-family: monospace;
            color: white;
            text-shadow: 0 2px 3px rgba(0,0,0,0.2);
            background: #6c757d;
            transform: scale(1);
            min-height: 80px;
            touch-action: manipulation;
        }

        .grade-btn:active {
            transform: scale(0.92);
        }

        .btn-press-effect {
            transform: scale(0.88) !important;
            transition: transform 0.05s cubic-bezier(0.2, 0.9, 0.4, 1.1) !important;
        }

        .reset-all-btn {
            width: 100%;
            background: linear-gradient(115deg, #e06c4a, #c94f2c);
            border: none;
            border-radius: 60px;
            padding: 18px 0;
            font-size: 1.25rem;
            font-weight: 800;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 20px rgba(201, 79, 44, 0.35);
            margin-top: 8px;
            letter-spacing: 0.8px;
            touch-action: manipulation;
        }

        .reset-all-btn:active {
            transform: scale(0.96);
        }

        .reset-all-btn span {
            font-size: 1.5rem;
        }

        .marks-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            flex-wrap: wrap;
            gap: 12px;
            cursor: pointer;
            user-select: none;
            padding: 6px 0;
        }

        .marks-header-left span:first-child {
            font-weight: 800;
            color: #1e4a6e;
            font-size: 1.5rem;
            letter-spacing: -0.3px;
        }

        .marks-bubbles {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            min-height: 200px;
            max-height: 500px;
            overflow-y: auto;
            padding: 8px 4px;
        }

        .mark-bubble {
            border-radius: 70px;
            padding: 12px 20px;
            font-weight: 800;
            font-size: 1.7rem;
            box-shadow: 0 6px 12px rgba(0,0,0,0.12);
            display: inline-flex;
            align-items: center;
            gap: 14px;
            color: white;
            text-shadow: 0 2px 2px rgba(0,0,0,0.2);
            animation: fadeIn 0.2s ease;
        }

        .remove-mark {
            background: rgba(0,0,0,0.25);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 44px;
            font-size: 26px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            touch-action: manipulation;
        }

        .remove-mark:active {
            background: rgba(255,255,255,0.5);
            transform: scale(0.9);
        }

        .empty-marks {
            color: #88a0b8;
            font-style: italic;
            font-size: 1.2rem;
            padding: 48px 12px;
            text-align: center;
            font-weight: 500;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(12px);
            color: white;
            padding: 14px 28px;
            border-radius: 70px;
            font-size: 1rem;
            font-weight: 600;
            z-index: 1000;
            animation: slideUp 0.25s ease;
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @media (max-width: 550px) {
            body {
                padding: 12px;
            }
            .main-column, .marks-list-section {
                padding: 16px 18px 26px;
            }
            .grades-grid {
                gap: 10px;
            }
            .grade-btn {
                font-size: 1.7rem;
                padding: 14px 0;
                min-height: 70px;
            }
            .stat-value {
                font-size: 2rem;
            }
            .final-grade .stat-value {
                font-size: 2.8rem;
            }
            .mark-bubble {
                font-size: 1.5rem;
                padding: 9px 16px;
                gap: 10px;
            }
            .remove-mark {
                width: 38px;
                height: 38px;
                font-size: 22px;
            }
            .marks-header-left span:first-child {
                font-size: 1.35rem;
            }
            .reset-all-btn {
                padding: 14px 0;
                font-size: 1.1rem;
            }
            .action-feedback {
                padding: 10px 20px;
                font-size: 1rem;
            }
            .toast {
                font-size: 0.9rem;
                padding: 10px 20px;
                white-space: nowrap;
            }
        }

        @media (max-width: 420px) {
            .grades-grid {
                gap: 8px;
            }
            .grade-btn {
                font-size: 1.5rem;
                padding: 12px 0;
                min-height: 64px;
            }
            .stat-item {
                padding: 10px 4px;
            }
            .stat-value {
                font-size: 1.7rem;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.92);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="main-column">
        <div class="floating-message-area" id="floatingMessageArea">
            <div class="action-feedback" id="actionFeedback">
                <span>✨</span>
                <span id="feedbackText">Отметка добавлена</span>
            </div>
        </div>

        <div class="stats-panel">
            <div class="stat-row">
                <div class="stat-item">
                    <div class="stat-label">📊 Сумма</div>
                    <div class="stat-value" id="sumDisplay">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">🔢 Количество</div>
                    <div class="stat-value" id="countDisplay">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">🎯 Среднее</div>
                    <div class="stat-value" id="avgHundredths">—</div>
                </div>
            </div>
            <div class="final-grade">
                <div class="stat-label">⭐ ИТОГОВАЯ</div>
                <div class="stat-value" id="finalGrade">—</div>
            </div>
        </div>

        <div class="grades-grid" id="gradesGrid"></div>

        <button class="reset-all-btn" id="globalResetBtn">
            <span>🗑️</span> Очистить всё
        </button>
    </div>

    <div class="right-column">
        <div class="marks-list-section">
            <div class="marks-header" id="marksHeader">
                <div class="marks-header-left">
                    <span>📝 Список</span>
                </div>
            </div>
            <div id="marksContainer" class="marks-bubbles"></div>
        </div>
    </div>
</div>

<script>
    let gradesArray = [];
    let longPressTimer = null;
    let currentFeedbackTimeout = null;

    const sumDisplay = document.getElementById('sumDisplay');
    const countDisplay = document.getElementById('countDisplay');
    const avgHundredthsSpan = document.getElementById('avgHundredths');
    const finalGradeSpan = document.getElementById('finalGrade');
    const marksContainer = document.getElementById('marksContainer');
    const gradesGrid = document.getElementById('gradesGrid');
    const marksHeader = document.getElementById('marksHeader');
    const globalResetBtn = document.getElementById('globalResetBtn');
    
    const actionFeedback = document.getElementById('actionFeedback');
    const feedbackTextSpan = document.getElementById('feedbackText');

    function getGradeColor(grade) {
        const t = (grade - 1) / 9;
        const r = Math.floor(220 - t * 170);
        const g = Math.floor(40 + t * 180);
        const b = 45;
        return `rgb(${r}, ${g}, ${b})`;
    }

    function getDeletedMarkWord(n) {
        if (n === 0) return '';
        if (n % 10 === 1 && n % 100 !== 11) return 'отметка';
        if ([2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100)) return 'отметки';
        return 'отметок';
    }

    function showToast(message, duration = 1800) {
        const existingToast = document.querySelector('.toast');
        if (existingToast) existingToast.remove();
        
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        document.body.appendChild(toast);
        
        setTimeout(() => {
            toast.remove();
        }, duration);
    }

    function showFloatingMessage(text, emoji = '✨') {
        if (currentFeedbackTimeout) {
            clearTimeout(currentFeedbackTimeout);
        }
        feedbackTextSpan.textContent = text;
        const iconSpan = actionFeedback.querySelector('span:first-child');
        if (iconSpan) iconSpan.textContent = emoji;
        
        actionFeedback.classList.add('show');
        
        currentFeedbackTimeout = setTimeout(() => {
            actionFeedback.classList.remove('show');
        }, 1600);
    }

    function animateButtonPress(gradeValue) {
        const buttons = document.querySelectorAll('.grade-btn');
        let targetBtn = null;
        for (let btn of buttons) {
            if (parseInt(btn.textContent) === gradeValue) {
                targetBtn = btn;
                break;
            }
        }
        if (targetBtn) {
            targetBtn.classList.add('btn-press-effect');
            setTimeout(() => {
                targetBtn.classList.remove('btn-press-effect');
            }, 120);
        }
    }

    function updateAll() {
        const sum = gradesArray.reduce((s, v) => s + v, 0);
        const count = gradesArray.length;
        
        sumDisplay.textContent = sum;
        countDisplay.textContent = count;
        
        if (count === 0) {
            avgHundredthsSpan.textContent = '—';
            finalGradeSpan.textContent = '—';
        } else {
            const avg = sum / count;
            avgHundredthsSpan.textContent = avg.toFixed(2);
            const finalGrade = Math.round(avg);
            finalGradeSpan.textContent = finalGrade;
        }
        
        renderMarks();
        saveToLocalStorage();
    }

    function renderMarks() {
        if (gradesArray.length === 0) {
            marksContainer.innerHTML = '<div class="empty-marks">Нет отметок</div>';
            return;
        }
        
        marksContainer.innerHTML = '';
        gradesArray.forEach((grade, idx) => {
            const bubble = document.createElement('div');
            bubble.className = 'mark-bubble';
            bubble.style.background = getGradeColor(grade);
            bubble.innerHTML = `
                <span>${grade}</span>
                <button class="remove-mark" data-idx="${idx}">✕</button>
            `;
            marksContainer.appendChild(bubble);
        });
        
        document.querySelectorAll('.remove-mark').forEach(btn => {
            btn.onclick = (e) => {
                e.stopPropagation();
                const idx = parseInt(btn.getAttribute('data-idx'));
                if (!isNaN(idx) && idx >= 0 && idx < gradesArray.length) {
                    const deletedMark = gradesArray[idx];
                    gradesArray.splice(idx, 1);
                    updateAll();
                    showFloatingMessage(`Удалена ${deletedMark}`, '🗑️');
                    showToast(`❌ ${deletedMark} удалена`, 1200);
                }
            };
        });
    }

    function addGrade(grade) {
        if (grade < 1 || grade > 10) return;
        
        animateButtonPress(grade);
        gradesArray.push(grade);
        updateAll();
        
        showFloatingMessage(`+${grade}`, '➕');
        showToast(`➕ ${grade}`, 900);
    }

    function clearAllGrades() {
        if (gradesArray.length === 0) {
            showFloatingMessage('Список пуст', '✨');
            showToast('Нет отметок', 1300);
            return;
        }
        const count = gradesArray.length;
        gradesArray = [];
        updateAll();
        showFloatingMessage(`Очищено ${count} ${getDeletedMarkWord(count)}`, '🧹');
        showToast(`🗑️ Удалено ${count} ${getDeletedMarkWord(count)}`);
        
        if (globalResetBtn) {
            globalResetBtn.style.transform = 'scale(0.96)';
            setTimeout(() => {
                globalResetBtn.style.transform = '';
            }, 180);
        }
    }

    function createGradeButtons() {
        gradesGrid.innerHTML = '';
        for (let i = 1; i <= 10; i++) {
            const btn = document.createElement('button');
            btn.className = 'grade-btn';
            btn.textContent = i;
            btn.style.background = getGradeColor(i);
            btn.onclick = () => addGrade(i);
            gradesGrid.appendChild(btn);
        }
    }

    function setupLongPressClear() {
        if (!marksHeader) return;
        
        let pressTimer = null;
        
        function startPress(e) {
            e.preventDefault();
            pressTimer = setTimeout(() => {
                clearAllGrades();
                marksHeader.style.opacity = '0.7';
                setTimeout(() => {
                    marksHeader.style.opacity = '1';
                }, 200);
                showFloatingMessage('Очистка', '⌛');
            }, 550);
        }
        
        function cancelPress() {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        }
        
        marksHeader.addEventListener('mousedown', startPress);
        marksHeader.addEventListener('mouseup', cancelPress);
        marksHeader.addEventListener('mouseleave', cancelPress);
        marksHeader.addEventListener('touchstart', startPress, { passive: false });
        marksHeader.addEventListener('touchend', cancelPress);
        marksHeader.addEventListener('touchcancel', cancelPress);
    }

    function setupKeyboardShortcuts() {
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            
            const key = e.key;
            
            if (key >= '1' && key <= '9') {
                e.preventDefault();
                const grade = parseInt(key);
                animateButtonPress(grade);
                gradesArray.push(grade);
                updateAll();
                showFloatingMessage(`+${grade} (⌨️)`, '⌨️');
                showToast(`⌨️ ${grade}`, 800);
            }
            else if (key === '0') {
                e.preventDefault();
                animateButtonPress(10);
                gradesArray.push(10);
                updateAll();
                showFloatingMessage(`+10 (⌨️)`, '⌨️');
                showToast(`⌨️ 10`, 800);
            }
            else if (key === 'Delete' || key === 'Del') {
                e.preventDefault();
                if (gradesArray.length > 0) {
                    const lastGrade = gradesArray[gradesArray.length - 1];
                    gradesArray.pop();
                    updateAll();
                    showFloatingMessage(`Удалена ${lastGrade}`, '⌨️🗑️');
                    showToast(`⌨️ Удалена ${lastGrade}`);
                } else {
                    showFloatingMessage('Нет отметок', '⚠️');
                }
            }
            else if (key === 'Backspace' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                clearAllGrades();
                showFloatingMessage('Сброс', '🧹');
            }
        });
    }

    function saveToLocalStorage() {
        localStorage.setItem('grades', JSON.stringify(gradesArray));
    }

    function loadFromLocalStorage() {
        const saved = localStorage.getItem('grades');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed)) {
                    gradesArray = parsed.filter(v => typeof v === 'number' && v >= 1 && v <= 10);
                    updateAll();
                }
            } catch(e) {}
        }
    }

    // Регистрация Service Worker для PWA
    function registerSW() {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                console.log('SW registered:', reg);
            }).catch(err => {
                console.error('SW registration failed:', err);
            });
        }
    }

    function init() {
        createGradeButtons();
        loadFromLocalStorage();
        if (gradesArray.length === 0) {
            updateAll();
        }
        setupLongPressClear();
        setupKeyboardShortcuts();
        registerSW();
        
        if (globalResetBtn) {
            globalResetBtn.addEventListener('click', (e) => {
                e.preventDefault();
                clearAllGrades();
            });
        }
        
        setTimeout(() => {
            showFloatingMessage('Готово', '🎯');
        }, 400);
        
        showToast('Нажмите на отметку', 2000);
    }
    
    init();
</script>
</body>
</html>
